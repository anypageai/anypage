[package]
name = "anypage-sheet"
description = "Spreadsheet module: xlsx and csv, formulas, ranges (IronCalc)"
version = "0.0.1"
edition = "2021"
publish = false
license = "MIT OR Apache-2.0"

[dependencies]
anypage-core = { path = "../anypage-core" }
anypage-engine = { path = "../anypage-engine" }
anypage-runtime = { path = "../anypage-runtime" }
log = "0.4"
# The spreadsheet engine: formulas, functions, evaluation, xlsx in and out.
# MIT OR Apache-2.0; pure Rust (zip with zopfli + flate2/zlib-rs).
ironcalc = "0.9"
# CSV reading and writing with RFC 4180 quoting (already a dependency of ironcalc_base).
csv = "1.3"
# Already in the tree through ironcalc; used to measure what an xlsx unpacks to
# before it is parsed (zip bomb guard).
zip = { version = "9", default-features = false, features = ["deflate"] }
# Already in the tree through ironcalc (same version): the xlsx pre-scan reads
# every part as a stream of XML events. MIT.
quick-xml = "0.42"

[dev-dependencies]
serde_json = "1"
png = "0.18"
