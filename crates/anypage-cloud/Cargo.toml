[package]
name = "anypage-cloud"
description = "Cloud module: HTTPS with capability checks, OpenAI-compatible streaming, AWS S3 (SigV4), Google Cloud Storage"
version = "0.0.1"
edition = "2021"
publish = false

[dependencies]
anypage-core = { path = "../anypage-core" }
anypage-engine = { path = "../anypage-engine" }
anypage-runtime = { path = "../anypage-runtime" }
log = "0.4"
serde_json = "1"
base64 = "0.22"
# TLS through rustls with the ring provider and the webpki root set: no
# aws-lc-rs (it needs NASM/CMake on Windows), no gzip.
ureq = { version = "3.5", default-features = false, features = ["rustls"] }
# HMAC-SHA256 / SHA-256 for SigV4 and RS256 signing for Google service
# accounts; already in the tree through rustls.
ring = "0.17"
# Fast substring search for scrubbing secrets out of responses; already in
# the tree through serde_json (MIT OR Unlicense).
memchr = "2"

[dev-dependencies]
# Independent RS256 verification of the JWTs we sign, and test key generation.
rsa = { version = "0.9", features = ["sha2"] }
rand = "0.8"
