[workspace]
resolver = "2"
members = [
    "crates/anypage-core",
    "crates/anypage-engine",
    "crates/anypage-demo",
    "apps/desktop",
    "apps/android",
]
# PDF importer is parked; the engine is not PDF-first.
exclude = ["crates/anypage-pdf"]

[workspace.package]
version = "0.0.1"
edition = "2021"
publish = false

[workspace.dependencies]
anypage-core = { path = "crates/anypage-core" }
anypage-engine = { path = "crates/anypage-engine" }
anypage-demo = { path = "crates/anypage-demo" }

# Pinned to API generations known to work together.
# wgpu 30 is current upstream; upgrading is a deliberate, separate step.
wgpu = "26"
winit = "0.30"
pollster = "0.4"
bytemuck = { version = "1", features = ["derive"] }
memory-stats = "1"
tiny-skia = "0.11"
swash = "0.2"
log = "0.4"

# Keep `target/` small (docs/ARCHITECTURE.md section 16) and dependencies fast even in dev.
[profile.dev]
debug = "line-tables-only"
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[profile.release]
debug = "line-tables-only"
